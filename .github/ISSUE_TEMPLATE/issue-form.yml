name: "issue 생성"
description: "Repository에 issue를 생성합니다."
labels: [feat]
title: "issue 이름을 작성해주세요"
body:
  - type: input
    id: branch
    attributes:
      label: "🌳 브랜치명 (Branch)"
      description: "브랜치명을 작성해주세요"
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: "📝 상세 내용(Description)"
      description: "이슈에 대해서 간략히 설명해주세요"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ TODO (Tasks)"
      description: "해당 이슈에 대해 필요한 작업목록을 작성해주세요"
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "🔎 Reference"
      description: "추가 참고사항이 있다면 작성해주세요"
    validations:
      required: false
