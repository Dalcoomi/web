name: Dalcoomi Frontend CI Prod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: "recursive"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 개발 단계에서는 주석 처리
      # - name: Run linting
      #   run: npm run lint

      # - name: Type check
      #   run: npx tsc --noEmit

      - name: Setup environment for build test
        run: |
          cp env-config/.env ./
          cp env-config/.env.local ./.env.local

      - name: Test build
        run: npm run build
