name: Dalcoomi Frontend CD for Prod

on:
  workflow_run:
    workflows: ["Dalcoomi Frontend CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: "recursive"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Setup production environment
        run: |
          cp env-config/.env ./
          cp env-config/.env.production ./.env.local

      - name: Build for production
        run: NODE_ENV=production npm run build

      - name: Public IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Github Actions IP 보안그룹 추가
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_PROD_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_PROD_USER }}
          key: ${{ secrets.EC2_PROD_PRIVATE_KEY }}
          source: ".,!node_modules,!.git"
          target: "/var/www/dalcoomi-frontend"

      - name: Start application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_PROD_USER }}
          key: ${{ secrets.EC2_PROD_PRIVATE_KEY }}
          script: |
            cd /var/www/dalcoomi-frontend

            # Node.js 22 버전 확인
            node --version

            # 의존성 설치
            npm ci

            # 🔥 EC2에서 프로덕션 빌드 (sw.js 생성)
            NODE_ENV=production npm run build

            # PM2로 Next.js 시작 (3000 포트)
            pm2 restart dalcoomi-frontend || pm2 start npm --name "dalcoomi-frontend" -- start

            # Nginx 설정 테스트 및 리로드
            sudo nginx -t && sudo systemctl reload nginx

            # PM2 상태 확인
            pm2 status

            # 배포 상태 확인
            sleep 10
            if pm2 describe dalcoomi-frontend | grep -q "online"; then
              echo "✅ 프론트엔드 배포 성공"
            else
              echo "❌ 프론트엔드 배포 실패"
              pm2 logs dalcoomi-frontend --lines 20
              exit 1
            fi

      - name: Github Actions IP 보안그룹 삭제
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_PROD_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deployment Status Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 프론트엔드 배포가 성공적으로 완료되었습니다!"
          else
            echo "🚨 프론트엔드 배포 중 오류가 발생했습니다."
          fi
