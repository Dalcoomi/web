name: Dalcoomi Frontend CI Dev

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: "recursive"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 개발 단계에서는 주석 처리
      # - name: Run linting
      #   run: npm run lint

      # - name: Type check
      #   run: npx tsc --noEmit

      - name: Setup environment for build test
        run: |
          cp env-config/.env ./
          cp env-config/.env.local ./.env.local

      - name: Test build
        run: npm run build
