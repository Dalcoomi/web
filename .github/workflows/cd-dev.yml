name: Dalcoomi Frontend CD Dev

on:
  workflow_run:
    workflows: ["Dalcoomi Frontend CI Dev"]
    types: [completed]
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: "recursive"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Clean build cache
        run: rm -rf .next

      - name: Build for dev
        run: NODE_ENV=production APP_ENV=dev npm run build

      - name: Public IP
        id: ip
        uses: haythem/public-ip@bdddd92c198b0955f0b494a8ebeac529754262ff # v1.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Github Actions IP 보안그룹 추가
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_DEV_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Prepare Deployment Directory
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/dalcoomi-frontend
            sudo chown -R $USER:$USER /var/www/dalcoomi-frontend
            sudo chmod -R 755 /var/www/dalcoomi-frontend

      - name: Deploy to EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_PRIVATE_KEY }}
          source: ".next,public,src,package.json,package-lock.json,next.config.ts,env-config,ecosystem.config.js"
          target: "/var/www/dalcoomi-frontend"

      - name: Start application
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_PRIVATE_KEY }}
          script: |
            # NVM 로드
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/dalcoomi-frontend

            # Node.js 24 버전 확인
            node --version

            # 의존성 설치
            npm ci

            # PM2로 Next.js 시작 (3000 포트)
            pm2 delete dalcoomi-frontend || true
            APP_ENV=dev pm2 start ecosystem.config.js

            # Nginx 설정 테스트 및 리로드
            sudo nginx -t && sudo systemctl reload nginx

            # PM2 상태 확인
            pm2 status

            # 배포 상태 확인
            sleep 10
            if pm2 describe dalcoomi-frontend | grep -q "online"; then
              echo "✅ 프론트엔드 배포 성공"
            else
              echo "❌ 프론트엔드 배포 실패"
              pm2 logs dalcoomi-frontend --lines 20
              exit 1
            fi

      - name: Github Actions IP 보안그룹 삭제
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_DEV_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deployment Status Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 프론트엔드 배포가 성공적으로 완료되었습니다!"
          else
            echo "🚨 프론트엔드 배포 중 오류가 발생했습니다."
          fi
